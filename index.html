<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripWays Hotels | Luxury Stays & Boutique Hotel Booking</title>
    <meta
      name="description"
      content="Discover and book handpicked luxury hotels, boutique stays, and premier resort suites. Enjoy seamless booking, instant confirmation, and exclusive guest experiences."
    />
    <meta
      name="keywords"
      content="hotel booking, luxury hotels, boutique hotels, resort stays, hotel reservations, vacation suites, TripWays hotels, Ethiopia hotels, Addis Ababa hotels"
    />
    <meta name="author" content="TripWays Hotels" />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripWays" />
    <meta property="og:site_name" content="TripWays Hotels" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TripWays Hotels | Luxury Stays & Boutique Hotel Booking" />
    <meta
      property="og:description"
      content="Discover and book handpicked luxury hotels, boutique stays, and premier resort suites. Enjoy seamless booking, instant confirmation, and exclusive guest experiences."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://tripways-static-assets.leultesfaye0755.workers.dev"
      crossorigin
    />
    <link
      rel="dns-prefetch"
      href="//tripways-static-assets.leultesfaye0755.workers.dev"
    />
    <!-- Google Fonts loaded async (media-swap) so the stylesheet never blocks first paint;
         noscript keeps fonts working when JS is disabled. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <link
      rel="icon"
      type="image/x-icon"
      href="https://tripways-static-assets.leultesfaye0755.workers.dev/favicon-v2.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://tripways-static-assets.leultesfaye0755.workers.dev/logo32-v2.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="https://tripways-static-assets.leultesfaye0755.workers.dev/logo192-v2.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://tripways-static-assets.leultesfaye0755.workers.dev/apple-touch-icon-v2.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <script>
      ;(() => {
        const STORAGE_KEY = 'hotel-theme'
        const rawValue = window.localStorage.getItem(STORAGE_KEY)
        const theme =
          rawValue === 'light' || rawValue === 'dark' ? rawValue : 'dark'
        const root = document.documentElement
        root.dataset.theme = theme
        root.classList.remove('theme-dark', 'theme-light', 'dark')
        root.classList.add('theme-' + theme)
        if (theme === 'dark') root.classList.add('dark')
      })()
    </script>
    <script>
      ;(() => {
        try {
          const value = window.localStorage.getItem('hotel-locale')
          const locale = value === 'am' ? 'am' : 'en'
          document.documentElement.lang = locale
        } catch {
          document.documentElement.lang = 'en'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
